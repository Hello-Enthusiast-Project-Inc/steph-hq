<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- v319 2026-04-11 -->
<!-- Home screen / PWA meta tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Base">
<meta name="mobile-web-app-capable" content="yes">
<title>Home Base 🌿</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f0ebe3;
    --card: #e8e0d5;
    --card2: #ddd4c6;
    --brown: #8b6f5e;
    --brown-dark: #6b4f3f;
    --green: #7a9e7e;
    --green-light: #a8c5a0;
    --text: #3d2e26;
    --text-light: #7a6a5e;
    --white: #faf7f3;
    --check: #7a9e7e;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(61,46,38,0.10);
  }

  body {
    font-family: -apple-system, 'Georgia', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 480px;
    margin: 0 auto;
  }


  /* SCREENS */
  .screen { display: none !important; padding: 0 0 80px 0; min-height: 100vh; }
  .screen.active { display: block !important; }
  #screen-home.active { display: flex !important; }


  /* HEADER */
  .header {
    background: var(--bg);
    padding: 52px 20px 16px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .header .back {
    position: absolute;
    left: 20px;
    top: 54px;
    font-size: 14px;
    color: var(--brown);
    cursor: pointer;
    font-family: -apple-system, sans-serif;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 700;
    font-style: italic;
    color: var(--text);
    letter-spacing: -0.5px;
    padding-top: 24px;
  }
  .header p {
    font-size: 13px;
    color: var(--text-light);
    font-family: -apple-system, sans-serif;
    margin-top: 2px;
  }

  /* HOME GRID */
  #screen-home {
    flex-direction: column;
    min-height: 100dvh;
    padding-bottom: 16px;
  }
  .home-header {
    padding: 50px 20px 0px;
    text-align: center;
  }
  .home-widget {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: -apple-system, sans-serif;
    padding: 2px 20px 6px;
    justify-content: center;
  }
  .home-widget .hw-date {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }
  .home-widget .hw-sep {
    color: var(--text-light);
    font-size: 11px;
  }
  .home-widget .hw-weather {
    font-size: 12px;
    color: var(--text-light);
  }
  .home-header h1 {
    font-size: 24px;
    font-style: italic;
    font-weight: 700;
    color: var(--text);
  }
  .home-header p {
    color: var(--text-light);
    font-size: 13px;
    margin-top: 2px;
    font-family: -apple-system, sans-serif;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 0 16px 20px;
  }
  .home-grid {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 0 14px 8px;
    flex: 1;
    align-content: center;
  }
  .tile {
    background: #d9c9b4;
    border-radius: 24px;
    padding: 26px 16px 22px;
    cursor: pointer;
    transition: transform 0.15s, filter 0.15s;
    box-shadow: 0 4px 16px rgba(100,75,50,0.13);
    text-align: center;
    user-select: none;
  }
  .home-grid .tile {
    border-radius: 22px;
    padding: 20px 14px 18px;
  }
  .tile:active { transform: scale(0.96); filter: brightness(0.95); }
  .tile .tile-emoji { font-size: 34px; display: block; margin-bottom: 10px; }
  .home-grid .tile .tile-emoji { font-size: 30px; margin-bottom: 8px; }
  .tile .tile-label {
    font-size: 14px;
    font-family: -apple-system, sans-serif;
    color: #4a3728;
    font-weight: 600;
  }
  .home-grid .tile .tile-label { font-size: 13px; font-weight: 600; }

  /* PROGRESS RING */
  .ring-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 0 10px;
  }
  .ring-container { position: relative; width: 120px; height: 120px; }
  .ring-container svg { transform: rotate(-90deg); }
  .ring-bg { fill: none; stroke: var(--card2); stroke-width: 8; }
  .ring-fill { fill: none; stroke: var(--green); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.4s ease; }
  .ring-text {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .ring-text .ring-count { font-size: 22px; font-weight: 700; color: var(--text); font-style: italic; }
  .ring-text .ring-pct { font-size: 11px; color: var(--text-light); font-family: -apple-system, sans-serif; }
  .ring-date {
    font-size: 15px;
    color: var(--text-light);
    margin-top: 8px;
    font-family: -apple-system, sans-serif;
  }

  /* CHECKLIST */
  .checklist { padding: 8px 16px; }
  .check-item {
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background 0.15s;
    box-shadow: var(--shadow);
    gap: 12px;
    user-select: none;
  }
  .check-item.done { opacity: 0.5; }
  .check-item .ci-radio {
    width: 24px; height: 24px; min-width: 24px;
    border-radius: 50%;
    border: 2px solid var(--brown);
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    background: transparent;
  }
  .check-item.done .ci-radio {
    background: var(--green);
    border-color: var(--green);
  }
  .check-item.done .ci-radio::after {
    content: '✓';
    color: white;
    font-size: 13px;
    font-weight: 700;
  }
  .check-item .ci-emoji { font-size: 20px; }
  .check-item .ci-label {
    font-size: 15px;
    font-family: -apple-system, sans-serif;
    color: var(--text);
    flex: 1;
  }
  .check-item.done .ci-label { text-decoration: line-through; color: var(--text-light); }

  /* LISTS */
  .list-section { padding: 0 16px; }
  .list-section h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-light);
    font-family: -apple-system, sans-serif;
    margin: 20px 0 10px;
  }
  .list-item {
    display: flex;
    align-items: center;
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 8px;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .list-item .li-check {
    width: 22px; height: 22px; min-width: 22px;
    border-radius: 50%;
    border: 2px solid var(--brown);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .list-item.done .li-check {
    background: var(--green);
    border-color: var(--green);
  }
  .list-item.done .li-check::after { content: '✓'; color: white; font-size: 12px; font-weight: 700; }
  .list-item .li-text {
    font-size: 15px;
    font-family: -apple-system, sans-serif;
    color: var(--text);
    flex: 1;
    outline: none;
    background: transparent;
    border: none;
    caret-color: var(--brown);
  }
  .list-item.done .li-text { text-decoration: line-through; color: var(--text-light); }
  .list-item .li-delete {
    color: var(--text-light);
    font-size: 18px;
    cursor: pointer;
    padding: 0 4px;
    opacity: 0.4;
  }
  .list-item .li-delete:hover { opacity: 1; }

  /* Todo drag handle + pin */
  .todo-drag-handle {
    font-size: 18px;
    color: var(--text-light);
    opacity: 0.4;
    cursor: grab;
    user-select: none;
    touch-action: none;
    padding: 0 2px 0 0;
    flex-shrink: 0;
    font-family: monospace;
    letter-spacing: -2px;
  }
  .todo-drag-handle:active { cursor: grabbing; opacity: 0.8; }
  .todo-pin-btn {
    font-size: 17px;
    cursor: pointer;
    opacity: 1;
    flex-shrink: 0;
    padding: 4px 6px;
    min-width: 32px;
    text-align: center;
    user-select: none;
    filter: grayscale(0.5);
    transition: filter 0.15s;
  }
  .todo-pin-btn:active { filter: grayscale(0); }
  .list-item.todo-pinned {
    border-left: 3px solid var(--brown);
    background: linear-gradient(90deg, rgba(139,111,94,0.08) 0%, var(--card) 18px);
  }
  .list-item.todo-pinned .todo-pin-btn { filter: grayscale(0); }

  .add-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .add-input {
    flex: 1;
    background: var(--white);
    border: 1.5px solid var(--card2);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 15px;
    font-family: -apple-system, sans-serif;
    color: var(--text);
    outline: none;
  }
  .add-input:focus { border-color: var(--green); }
  .add-btn {
    background: var(--green);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 18px;
    font-size: 15px;
    cursor: pointer;
    font-family: -apple-system, sans-serif;
    font-weight: 600;
  }

  /* RECIPE CARDS */
  .recipe-grid { padding: 0 16px; }
  .recipe-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: background 0.15s;
  }
  .recipe-card:active { background: var(--card2); }
  .recipe-card h3 {
    font-size: 17px;
    font-style: italic;
    color: var(--text);
    margin-bottom: 4px;
  }
  .recipe-card p {
    font-size: 13px;
    color: var(--text-light);
    font-family: -apple-system, sans-serif;
  }
  .recipe-card .recipe-tag {
    display: inline-block;
    background: var(--green-light);
    color: var(--brown-dark);
    font-size: 11px;
    font-family: -apple-system, sans-serif;
    border-radius: 20px;
    padding: 3px 10px;
    margin-top: 8px;
  }

  /* RECIPE DETAIL */
  .recipe-detail { padding: 0 16px; }
  .recipe-detail h2 { font-size: 22px; font-style: italic; margin-bottom: 8px; }
  .recipe-detail .rd-source {
    font-size: 13px; color: var(--green); font-family: -apple-system, sans-serif; margin-bottom: 16px;
  }
  .recipe-detail .rd-source a { color: var(--green); }
  .recipe-detail h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-light); font-family: -apple-system, sans-serif; margin: 16px 0 8px;
  }
  .recipe-detail p, .recipe-detail li {
    font-size: 15px; font-family: -apple-system, sans-serif;
    color: var(--text); line-height: 1.6; margin-bottom: 6px;
  }
  .recipe-detail ul, .recipe-detail ol { padding-left: 20px; }

  /* NAV BAR */
  .nav { display: none; }

  /* CATEGORY PICKER MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.3);
    z-index: 200;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--white);
    border-radius: 24px 24px 0 0;
    padding: 20px 16px 40px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 -4px 24px rgba(0,0,0,0.12);
  }
  .modal-sheet h3 {
    font-size: 16px;
    font-style: italic;
    color: var(--text);
    margin-bottom: 14px;
    text-align: center;
  }
  .cat-btn {
    display: block;
    width: 100%;
    background: var(--card);
    border: none;
    border-radius: 14px;
    padding: 13px 16px;
    font-size: 15px;
    font-family: -apple-system, sans-serif;
    color: var(--text);
    text-align: left;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .cat-btn:active { background: var(--card2); }

  /* MEAL LOG */
  .meal-log { padding: 0 16px; }
  .macro-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
  }
  .macro-card h3 {
    font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-light); font-family: -apple-system, sans-serif; margin-bottom: 14px;
  }
  .macro-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .macro-label { font-size: 14px; font-family: -apple-system, sans-serif; color: var(--text); }
  .macro-val { font-size: 14px; font-family: -apple-system, sans-serif; color: var(--brown); font-weight: 600; }
  .macro-bar-wrap { background: var(--card2); border-radius: 6px; height: 6px; margin-bottom: 14px; }
  .macro-bar { height: 6px; border-radius: 6px; background: var(--green); transition: width 0.4s; }
  .meal-entry {
    background: var(--card);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
  }
  .meal-entry h4 { font-size: 15px; font-style: italic; color: var(--text); margin-bottom: 4px; }
  .meal-entry p { font-size: 13px; color: var(--text-light); font-family: -apple-system, sans-serif; }

  /* SECTION HEADERS */
  .section-pill {
    display: inline-block;
    background: var(--green-light);
    color: var(--brown-dark);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    font-family: -apple-system, sans-serif;
    font-weight: 600;
    margin: 16px 16px 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
